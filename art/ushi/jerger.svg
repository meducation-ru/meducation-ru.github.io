<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 412" role="img" aria-label="Типы тимпанограмм по Джергеру"><style>
text{font:600 13px Montserrat,Arial,sans-serif;fill:#2d2d2d}.s{font:400 11px 'PT Sans',Arial,sans-serif;fill:#475683}.frame{fill:#ffffff}
.lb{font:400 8.5px 'PT Sans',Arial,sans-serif;fill:#475683;paint-order:stroke;stroke:#ffffff;stroke-width:2.4;stroke-linejoin:round}
.lbp{font:400 8.5px 'PT Sans',Arial,sans-serif;fill:#6e2440}
.air{fill:url(#ear-air);stroke:#c98a9c;stroke-width:1.2}.bone{fill:url(#ear-hatch);stroke:#b3a283;stroke-width:1}
.promo{fill:url(#ear-promo);stroke:#b04e6a;stroke-width:1.2}
.oss{fill:url(#ear-oss);stroke:#a3864a;stroke-width:1.1}
.tm{fill:none;stroke:url(#ear-tm);stroke-width:3;stroke-linecap:round;opacity:.92}
.tmh{fill:none;stroke:#ffffff;stroke-width:.9;stroke-linecap:round;opacity:.5}
.adh{fill:none;stroke:#b8457a;stroke-width:6;stroke-linecap:round;opacity:.45}.ker{fill:url(#ear-ker);stroke:#c4a965;stroke-width:.9}
.plot{fill:#f6f3ff}.ax{stroke:#8a97bd;stroke-width:1}.cur{fill:none;stroke:#a771fe;stroke-width:2.6;stroke-linecap:round}
</style><defs>
<linearGradient id="ear-air" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fdf6f8"/><stop offset="1" stop-color="#fbeef2"/></linearGradient>
<pattern id="ear-hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#f5efe4"/><line x1="0" y1="0" x2="0" y2="5" stroke="#dfd3bd" stroke-width="1"/></pattern>
<radialGradient id="ear-promo" cx=".7" cy=".55" r=".8"><stop offset="0" stop-color="#f6c3cf"/><stop offset="1" stop-color="#e58fa5"/></radialGradient>
<linearGradient id="ear-oss" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fbf2dc"/><stop offset="1" stop-color="#e3cf9c"/></linearGradient>
<linearGradient id="ear-tm" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#c94a8f"/><stop offset=".5" stop-color="#e07fb4"/><stop offset="1" stop-color="#bd4486"/></linearGradient>
<radialGradient id="ear-ker" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#fffdf5"/><stop offset="1" stop-color="#efe2b8"/></radialGradient>
</defs><rect class="frame" width="420" height="412" rx="12"/><g transform="translate(4,4)"><text x="60" y="12" text-anchor="middle">A</text><g transform="translate(0,22)"><rect class="plot" x="6" y="4" width="126" height="128" rx="8"/><line class="ax" x1="10" y1="110" x2="130" y2="110"/><line class="ax" x1="90.0" y1="14" x2="90.0" y2="110"/><line class="ax" x1="70.0" y1="106" x2="70.0" y2="114"/><text class="s" x="10.0" y="126">-400</text><text class="s" x="58.0" y="126">-100</text><text class="s" x="87.0" y="126">0</text><path class="cur" d="M10 102 C60.0 102 80.0 48 90.0 48 C100.0 48 120.0 102 130 102"/></g></g><g transform="translate(144,4)"><text x="60" y="12" text-anchor="middle">As</text><g transform="translate(0,22)"><rect class="plot" x="6" y="4" width="126" height="128" rx="8"/><line class="ax" x1="10" y1="110" x2="130" y2="110"/><line class="ax" x1="90.0" y1="14" x2="90.0" y2="110"/><line class="ax" x1="70.0" y1="106" x2="70.0" y2="114"/><text class="s" x="10.0" y="126">-400</text><text class="s" x="58.0" y="126">-100</text><text class="s" x="87.0" y="126">0</text><path class="cur" d="M10 102 C60.0 102 80.0 86 90.0 86 C100.0 86 120.0 102 130 102"/></g></g><g transform="translate(284,4)"><text x="60" y="12" text-anchor="middle">Ad</text><g transform="translate(0,22)"><rect class="plot" x="6" y="4" width="126" height="128" rx="8"/><line class="ax" x1="10" y1="110" x2="130" y2="110"/><line class="ax" x1="90.0" y1="14" x2="90.0" y2="110"/><line class="ax" x1="70.0" y1="106" x2="70.0" y2="114"/><text class="s" x="10.0" y="126">-400</text><text class="s" x="58.0" y="126">-100</text><text class="s" x="87.0" y="126">0</text><path class="cur" d="M10 102 C60.0 102 80.0 12 90.0 12 C100.0 12 120.0 102 130 102"/></g></g><g transform="translate(4,172)"><text x="60" y="12" text-anchor="middle">B</text><g transform="translate(0,22)"><rect class="plot" x="6" y="4" width="126" height="128" rx="8"/><line class="ax" x1="10" y1="110" x2="130" y2="110"/><line class="ax" x1="90.0" y1="14" x2="90.0" y2="110"/><line class="ax" x1="70.0" y1="106" x2="70.0" y2="114"/><text class="s" x="10.0" y="126">-400</text><text class="s" x="58.0" y="126">-100</text><text class="s" x="87.0" y="126">0</text><path class="cur" d="M10 100 Q70 97 130 100"/></g></g><g transform="translate(144,172)"><text x="60" y="12" text-anchor="middle">C</text><g transform="translate(0,22)"><rect class="plot" x="6" y="4" width="126" height="128" rx="8"/><line class="ax" x1="10" y1="110" x2="130" y2="110"/><line class="ax" x1="90.0" y1="14" x2="90.0" y2="110"/><line class="ax" x1="70.0" y1="106" x2="70.0" y2="114"/><text class="s" x="10.0" y="126">-400</text><text class="s" x="58.0" y="126">-100</text><text class="s" x="87.0" y="126">0</text><path class="cur" d="M10 102 C10.0 102 30.0 48 40.0 48 C50.0 48 70.0 102 130 102"/></g></g><text class="s" x="6" y="350">По горизонтали давление в наружном слуховом проходе (даПа),</text><text class="s" x="6" y="367">по вертикали податливость. A пик около 0; As низкий пик;</text><text class="s" x="6" y="384">Ad очень высокий пик; B плоская кривая; C пик ниже -100 даПа.</text><text class="s" x="6" y="401">Схема, не масштаб.</text></svg>
